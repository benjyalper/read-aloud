<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
  <link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png?v=4">
  <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png?v=4">
  <link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png?v=4">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png?v=4">
  <link rel="manifest" href="manifest.json?v=4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Read Aloud">
  <title>Read Aloud</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --border: #2a2e38;
      --text: #e8e8ec;
      --muted: #9098a8;
      --accent: #4f8cff;
      --accent-hover: #3d75e0;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --panel: #ffffff;
        --border: #d1d1d6;
        --text: #1a1a1c;
        --muted: #6b6b75;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; display: flex; justify-content: center; }
    main {
      width: 100%;
      max-width: 720px;
      padding: 16px;
      padding-bottom: 60px;
    }
    h1 {
      font-size: 24px;
      margin: 8px 0 16px;
      letter-spacing: -0.5px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      max-height: 50vh;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row + .row { margin-top: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      font-family: inherit;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: var(--border); }
    label.btn { cursor: pointer; }
    label.btn input { display: none; }
    select, input[type="range"] {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 15px;
      font-family: inherit;
      min-height: 40px;
    }
    select { flex: 1; min-width: 200px; }
    .speed { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
    .speed input[type="range"] { flex: 1; padding: 0; min-height: 30px; }
    .player { display: flex; gap: 8px; flex-wrap: wrap; }
    .player .btn { flex: 1; min-width: 90px; }
    .status { font-size: 13px; color: var(--muted); flex: 1; min-width: 100%; }
    .progress {
      font-size: 14px;
      color: var(--muted);
      max-height: 240px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      line-height: 1.7;
    }
    .progress .current {
      background: var(--accent);
      color: white;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .small { font-size: 13px; color: var(--muted); }
    .pbar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .pbar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.15s ease-out;
      border-radius: 3px;
    }
    .pbar-fill.indeterminate {
      width: 35% !important;
      animation: pbar-slide 1.4s infinite ease-in-out;
      transition: none;
    }
    @keyframes pbar-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
    .pbar-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }
    @media (max-width: 500px) {
      main { padding: 10px; }
      h1 { font-size: 20px; }
      .player .btn { font-size: 14px; padding: 10px 8px; min-width: 70px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Read Aloud</h1>

    <section class="panel">
      <textarea id="text" dir="auto" placeholder="Paste text here, or load a file below."></textarea>
      <div class="small" id="textStats" style="margin-top: 4px; opacity: 0.7; min-height: 16px;"></div>
      <div class="row" style="margin-top: 10px;">
        <label class="btn secondary">
          <input type="file" id="file" accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,.webp" multiple hidden>
          Load files
        </label>
        <button class="btn secondary" id="cleanup" type="button" title="Remove copyright/header/footer boilerplate">Clean up ✨</button>
        <button class="btn secondary" id="summarize" type="button" title="Generate a summary">Summarize ✨</button>
        <button class="btn secondary" id="split" type="button" title="Split long text into numbered parts">Split ✂️</button>
        <button class="btn secondary" id="clear" type="button">Clear</button>
        <span id="status" class="status"></span>
      </div>
      <div class="row" style="margin-top: 8px;">
        <label style="display:flex; align-items:center; gap:8px;" class="small">
          OCR language
          <select id="ocrLang" style="min-width: 140px;">
            <option value="eng">English</option>
            <option value="heb">Hebrew (עברית)</option>
            <option value="eng+heb">English + Hebrew</option>
          </select>
        </label>
        <span class="small" style="opacity:0.7;">PDF, DOCX, TXT, or image. Multiple files supported.</span>
      </div>
      <div id="pbarWrap" hidden style="margin-top: 10px;">
        <div class="pbar"><div class="pbar-fill" id="pbarFill"></div></div>
        <div class="pbar-label" id="pbarLabel"></div>
      </div>
    </section>

    <section class="panel" id="partsPanel" hidden>
      <div class="row" style="margin-bottom: 8px;">
        <span class="small" id="partsLabel" style="flex:1;">Parts</span>
        <button class="btn secondary" id="clearParts" type="button" style="min-height:32px; padding: 6px 10px; font-size:13px;">Clear parts</button>
      </div>
      <div id="partsButtons" class="row" style="gap:6px;"></div>
      <div class="small" id="partActiveInfo" style="margin-top:8px; opacity:0.7;"></div>
      <div class="row" style="margin-top:10px; gap:6px;">
        <input type="text" id="partsRange" placeholder="all (or 4-13, 50-55, 100-)" autocomplete="off" style="flex:1; min-width:160px; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; min-height:40px;">
        <button class="btn" id="genAllParts" type="button" title="Generate MP3 for the selected parts and download as ZIP">Generate ⚡ (ZIP)</button>
      </div>
      <div class="small" id="rangeHint" style="margin-top:6px; opacity:0.7;"></div>
    </section>

    <section class="panel" id="summaryPanel" hidden>
      <div class="row" style="margin-bottom: 8px;">
        <span class="small" style="flex:1;">Summary <span id="summaryMode" class="small" style="opacity:0.7;"></span></span>
        <button class="btn secondary" id="playSummary" type="button" style="min-height:34px; padding: 6px 12px; font-size:13px;">▶ Read summary</button>
      </div>
      <textarea id="summary" dir="auto" placeholder="Generated summary will appear here." style="min-height: 140px;"></textarea>
    </section>

    <section class="panel">
      <div class="row">
        <select id="voice" aria-label="Voice"></select>
      </div>
      <div class="row">
        <div class="speed">
          <span class="small">Speed</span>
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" aria-label="Speed">
          <span id="speedValue" class="small">1.0×</span>
        </div>
      </div>
      <div class="row player">
        <button class="btn" id="play" type="button">▶ Play</button>
        <button class="btn secondary" id="pause" type="button">⏸ Pause</button>
        <button class="btn secondary" id="stop" type="button">⏹ Stop</button>
      </div>
    </section>

    <section class="panel" id="hqPanel">
      <div class="row" style="margin-bottom: 8px;">
        <span class="small" style="flex:1;">High-quality audio (MP3, neural voice)</span>
      </div>
      <div class="row">
        <select id="hqVoice" aria-label="HQ Voice"></select>
      </div>
      <div class="row">
        <button class="btn" id="hqGenerate" type="button">Generate MP3 ✨</button>
        <a id="hqDownload" class="btn secondary" download="read-aloud.mp3" hidden>↓ Download</a>
      </div>
      <audio id="hqAudio" controls hidden style="width:100%; margin-top:10px;"></audio>
      <div class="small" style="margin-top:6px; opacity:0.7;">Uses the Microsoft Edge neural voices (same on every device). Long texts are auto-chunked; up to 100,000 chars per request.</div>
    </section>

    <section class="panel" id="progressPanel" hidden>
      <div class="small" style="margin-bottom: 6px;">Progress</div>
      <div class="progress" id="progress"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }

    const $ = id => document.getElementById(id);
    const textEl = $('text');
    const fileEl = $('file');
    const clearEl = $('clear');
    const statusEl = $('status');
    const voiceEl = $('voice');
    const speedEl = $('speed');
    const speedValueEl = $('speedValue');
    const playEl = $('play');
    const pauseEl = $('pause');
    const stopEl = $('stop');
    const progressPanelEl = $('progressPanel');
    const progressEl = $('progress');

    let voices = [];

    function isNeural(v) {
      const n = v.name.toLowerCase();
      return n.includes('online') || n.includes('natural') || n.includes('neural') || n.includes('siri') || n.includes('enhanced');
    }
    function score(v) {
      let s = 0;
      if (isNeural(v)) s += 100;
      if (v.lang.startsWith('en')) s += 10;
      return s;
    }
    function loadVoices() {
      voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      const eng = voices.filter(v => v.lang.startsWith('en'));
      const other = voices.filter(v => !v.lang.startsWith('en'));
      const ranked = [...eng, ...other].sort((a, b) => score(b) - score(a));

      const prev = voiceEl.value;
      voiceEl.innerHTML = '';
      for (const v of ranked) {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} — ${v.lang}${isNeural(v) ? ' ✨' : ''}`;
        voiceEl.appendChild(opt);
      }
      if (prev && ranked.find(v => v.voiceURI === prev)) {
        voiceEl.value = prev;
      } else {
        const best = ranked.find(v => v.lang.startsWith('en')) || ranked[0];
        if (best) voiceEl.value = best.voiceURI;
      }
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    speedEl.addEventListener('input', () => {
      speedValueEl.textContent = parseFloat(speedEl.value).toFixed(1) + '×';
    });

    fileEl.addEventListener('change', async e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      try {
        const parts = [];
        let totalRaw = 0;
        let lastResult = null;
        let pdfPageCount = 0;
        let pdfCount = 0;
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const label = files.length > 1 ? `${i + 1}/${files.length}: ${f.name}` : f.name;
          setStatus(`Reading ${label}…`);
          const result = await readFile(f);
          lastResult = result;
          const raw = result.text;
          if (result.pageCount) { pdfPageCount += result.pageCount; pdfCount++; }
          parts.push(raw.trim());
          totalRaw += raw.length;
        }
        const combined = parts.filter(Boolean).join('\n\n');
        const singlePrecleanedPdf = files.length === 1 && lastResult && lastResult.isPreCleaned;
        const isAuto = files.some(f => !f.name.toLowerCase().endsWith('.txt'));
        const final = (isAuto && !singlePrecleanedPdf) ? reflowText(cleanupText(combined)) : combined;
        textEl.value = final.trim();
        updateTextStats();
        if (singlePrecleanedPdf) {
          docTotalPages = pdfPageCount;
          docPageMap = lastResult.pageMap;
          docOriginalText = textEl.value;
        } else {
          docTotalPages = (files.length === 1 && pdfCount === 1) ? pdfPageCount : 0;
          docPageMap = null;
          docOriginalText = '';
        }
        const removed = totalRaw - final.length;
        const note = isAuto && removed > 0 ? ` · cleaned ${removed.toLocaleString()} chars` : '';
        const pageNote = docTotalPages ? ` · ${docTotalPages} pages` : '';
        const what = files.length > 1 ? `${files.length} files` : files[0].name;
        setStatus(`Loaded ${what} (${wordCount(final).toLocaleString()} words · ${final.length.toLocaleString()} chars${note}${pageNote})`);
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message || err}`);
      } finally {
        fileEl.value = '';
        hideProgress();
      }
    });

    const PARTS_STORAGE_KEY = 'readaloud.parts.v1';
    const PART_SIZE = 10000;
    let docParts = [];
    let activePartIdx = -1;
    let docTotalPages = 0;
    let docPageMap = null;
    let docOriginalText = '';

    function pageRangeFromMap(startOffset, endOffset, pageMap) {
      if (!pageMap || !pageMap.length) return null;
      const overlap = pageMap.filter(pm => pm.start < endOffset && pm.end > startOffset);
      if (!overlap.length) return null;
      return { from: overlap[0].page, to: overlap[overlap.length - 1].page };
    }

    function splitByPageBoundaries(text, pageMap, maxLen) {
      const parts = [];
      let i = 0;
      while (i < pageMap.length) {
        const p = pageMap[i];
        const pageLen = p.end - p.start;
        if (pageLen > maxLen) {
          // Single page is bigger than maxLen — sub-split this page only.
          const subParts = splitTextIntoPartsWithOffsets(text.slice(p.start, p.end), maxLen);
          for (let k = 0; k < subParts.length; k++) {
            const sp = subParts[k];
            parts.push({
              start: p.start + sp.start,
              end: p.start + sp.end,
              text: sp.text,
              pages: { from: p.page, to: p.page },
              subIndex: subParts.length > 1 ? k : undefined,
              subTotal: subParts.length > 1 ? subParts.length : undefined,
            });
          }
          i++;
          continue;
        }
        // Pack consecutive pages until adding the next would exceed maxLen
        let lastIdx = i;
        for (let j = i + 1; j < pageMap.length; j++) {
          if (pageMap[j].end - p.start > maxLen) break;
          lastIdx = j;
        }
        const last = pageMap[lastIdx];
        parts.push({
          start: p.start,
          end: last.end,
          text: text.slice(p.start, last.end).trim(),
          pages: { from: p.page, to: last.page },
        });
        i = lastIdx + 1;
      }
      return parts;
    }

    function splitTextIntoPartsWithOffsets(text, maxLen) {
      // Find sentence boundaries (end positions) without altering the text.
      const re = /[.!?…]+\s*/g;
      const ends = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        ends.push(m.index + m[0].length);
        if (m.index === re.lastIndex) re.lastIndex++;
      }
      if (ends[ends.length - 1] !== text.length) ends.push(text.length);
      const sentences = [];
      let lastEnd = 0;
      for (const end of ends) {
        if (end > lastEnd) { sentences.push({ start: lastEnd, end }); lastEnd = end; }
      }
      const parts = [];
      let curStart = -1, curEnd = 0;
      for (const s of sentences) {
        const sLen = s.end - s.start;
        if (curStart < 0) { curStart = s.start; curEnd = s.end; continue; }
        if ((curEnd - curStart) + sLen > maxLen) {
          parts.push({ start: curStart, end: curEnd });
          curStart = s.start; curEnd = s.end;
        } else {
          curEnd = s.end;
        }
      }
      if (curStart >= 0 && curEnd > curStart) parts.push({ start: curStart, end: curEnd });
      return parts.map(p => ({ start: p.start, end: p.end, text: text.slice(p.start, p.end).trim() }));
    }

    function persistParts() {
      try {
        localStorage.setItem(PARTS_STORAGE_KEY, JSON.stringify({ parts: docParts, activePartIdx, totalPages: docTotalPages }));
      } catch (e) {
        console.error('Failed to persist parts:', e);
        setStatus('Could not save parts to storage (may be full).');
      }
    }

    function restoreParts() {
      try {
        const raw = localStorage.getItem(PARTS_STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.parts) && data.parts.length) {
          docParts = data.parts;
          activePartIdx = typeof data.activePartIdx === 'number' ? data.activePartIdx : -1;
          docTotalPages = typeof data.totalPages === 'number' ? data.totalPages : 0;
          renderParts();
        }
      } catch (e) {
        console.warn('Could not restore parts:', e);
      }
    }

    function renderParts() {
      const panel = $('partsPanel');
      const btns = $('partsButtons');
      const label = $('partsLabel');
      const info = $('partActiveInfo');
      btns.innerHTML = '';
      if (!docParts.length) {
        panel.hidden = true;
        info.textContent = '';
        return;
      }
      panel.hidden = false;
      const totalChars = docParts.reduce((a, p) => a + p.text.length, 0);
      const totalWords = docParts.reduce((a, p) => a + p.words, 0);
      label.textContent = `${docParts.length} parts · ${totalWords.toLocaleString()} words · ${totalChars.toLocaleString()} chars`;
      for (let i = 0; i < docParts.length; i++) {
        const p = docParts[i];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn ' + (i === activePartIdx ? '' : 'secondary');
        btn.style.padding = '8px 10px';
        btn.style.fontSize = '14px';
        btn.style.flex = '0 0 auto';
        if (p.pages) {
          const suffix = p.subTotal ? String.fromCharCode(97 + p.subIndex) : '';
          const pageLabel = p.pages.from === p.pages.to
            ? `${p.pages.from}${suffix}`
            : `${p.pages.from}–${p.pages.to}${suffix}`;
          btn.textContent = pageLabel;
          btn.style.minWidth = '64px';
          const subTag = p.subTotal ? ` (segment ${p.subIndex + 1}/${p.subTotal})` : '';
          btn.title = `Part ${i + 1}/${docParts.length} · pp ${p.pages.from}-${p.pages.to}${subTag} · ${p.words.toLocaleString()} words · ${p.text.length.toLocaleString()} chars`;
        } else {
          btn.textContent = String(i + 1);
          btn.style.minWidth = '46px';
          btn.title = `Part ${i + 1}/${docParts.length} · ${p.words.toLocaleString()} words · ${p.text.length.toLocaleString()} chars`;
        }
        btn.addEventListener('click', () => loadPart(i));
        btns.appendChild(btn);
      }
      if (activePartIdx >= 0 && docParts[activePartIdx]) {
        const p = docParts[activePartIdx];
        const pageTag = p.pages ? (p.pages.from === p.pages.to ? ` · p ${p.pages.from}` : ` · pp ${p.pages.from}-${p.pages.to}`) : '';
        info.textContent = `Showing part ${activePartIdx + 1} of ${docParts.length}${pageTag} (${p.words.toLocaleString()} words · ${p.text.length.toLocaleString()} chars)`;
      } else {
        const hasPages = docParts.some(p => p.pages);
        info.textContent = hasPages ? 'Tap a page range to load that part.' : 'Tap a number to load that part.';
      }
      if (typeof updateRangeHint === 'function') updateRangeHint();
    }

    function loadPart(i) {
      if (!docParts[i]) return;
      stop();
      activePartIdx = i;
      textEl.value = docParts[i].text;
      updateTextStats();
      persistParts();
      renderParts();
      setStatus(`Loaded part ${i + 1}/${docParts.length}`);
    }

    $('split').addEventListener('click', () => {
      const text = textEl.value;
      const trimmed = text.trim();
      if (!trimmed) { setStatus('Nothing to split.'); return; }
      const segments = splitTextIntoPartsWithOffsets(text, PART_SIZE);
      if (segments.length < 2) {
        setStatus(`Text fits in one part (${trimmed.length.toLocaleString()} chars; ${PART_SIZE.toLocaleString()} max).`);
        return;
      }
      const pageMapIsValid = docPageMap && text === docOriginalText;
      const usePageAligned = pageMapIsValid && docPageMap.length > 0;
      const partsSource = usePageAligned
        ? splitByPageBoundaries(text, docPageMap, PART_SIZE)
        : segments;
      docParts = partsSource.map(seg => {
        const part = { text: seg.text, chars: seg.text.length, words: wordCount(seg.text) };
        if (seg.pages) part.pages = seg.pages;
        else if (pageMapIsValid) {
          const pr = pageRangeFromMap(seg.start, seg.end, docPageMap);
          if (pr) part.pages = pr;
        }
        if (seg.subIndex !== undefined) {
          part.subIndex = seg.subIndex;
          part.subTotal = seg.subTotal;
        }
        return part;
      });
      activePartIdx = 0;
      textEl.value = docParts[0].text;
      updateTextStats();
      persistParts();
      renderParts();
      const accurate = docParts.some(p => p.pages);
      setStatus(`Split into ${docParts.length} parts${accurate ? ' with exact page ranges' : ''}. Loaded part 1.`);
    });

    let genAllAbort = null;
    const GEN_ALL_IDLE = 'Generate ⚡ (ZIP)';
    const GEN_ALL_BUSY = '⏹ Stop & save what we have';
    const rangeInputEl = $('partsRange');
    const rangeHintEl = $('rangeHint');

    function partsHavePages() {
      return docParts.length > 0 && docParts.some(p => p.pages);
    }

    function parsePartRange(input, total) {
      const trimmed = (input || '').trim();
      if (!trimmed) return Array.from({ length: total }, (_, i) => i + 1);
      const set = new Set();
      let invalid = false;
      for (const seg of trimmed.split(',')) {
        const s = seg.trim();
        if (!s) continue;
        if (s.includes('-')) {
          const [a, b] = s.split('-').map(p => p.trim());
          const from = a === '' ? 1 : parseInt(a, 10);
          const to = b === '' ? total : parseInt(b, 10);
          if (isNaN(from) || isNaN(to) || from < 1 || to < 1) { invalid = true; continue; }
          for (let i = Math.max(1, from); i <= Math.min(total, to); i++) set.add(i);
        } else {
          const n = parseInt(s, 10);
          if (isNaN(n) || n < 1) { invalid = true; continue; }
          if (n <= total) set.add(n);
        }
      }
      const list = Array.from(set).sort((a, b) => a - b);
      return invalid && list.length === 0 ? null : list;
    }

    function parsePageRangeToParts(input) {
      const trimmed = (input || '').trim();
      if (!trimmed) return Array.from({ length: docParts.length }, (_, i) => i + 1);
      const pageSet = new Set();
      let invalid = false;
      const cap = docTotalPages || 999999;
      for (const seg of trimmed.split(',')) {
        const s = seg.trim();
        if (!s) continue;
        if (s.includes('-')) {
          const [a, b] = s.split('-').map(p => p.trim());
          const from = a === '' ? 1 : parseInt(a, 10);
          const to = b === '' ? cap : parseInt(b, 10);
          if (isNaN(from) || isNaN(to) || from < 1 || to < 1) { invalid = true; continue; }
          for (let i = from; i <= to; i++) pageSet.add(i);
        } else {
          const n = parseInt(s, 10);
          if (isNaN(n) || n < 1) { invalid = true; continue; }
          pageSet.add(n);
        }
      }
      if (invalid && pageSet.size === 0) return null;
      const result = [];
      for (let i = 0; i < docParts.length; i++) {
        const p = docParts[i];
        if (!p.pages) continue;
        let overlaps = false;
        for (let pg = p.pages.from; pg <= p.pages.to; pg++) {
          if (pageSet.has(pg)) { overlaps = true; break; }
        }
        if (overlaps) result.push(i + 1);
      }
      return result;
    }

    function parseRange(input, total) {
      return partsHavePages() ? parsePageRangeToParts(input) : parsePartRange(input, total);
    }

    function updateRangePlaceholder() {
      const byPages = partsHavePages();
      rangeInputEl.placeholder = byPages
        ? `all pages (or e.g. 5-22, 30-50)`
        : `all parts (or e.g. 4-13, 50-55)`;
    }

    function updateRangeHint() {
      updateRangePlaceholder();
      if (!docParts.length) { rangeHintEl.textContent = ''; return; }
      const sel = parseRange(rangeInputEl.value, docParts.length);
      if (sel === null) { rangeHintEl.textContent = 'Invalid range.'; return; }
      const byPages = partsHavePages();
      const mode = byPages ? 'page' : 'part';
      if (sel.length === docParts.length) {
        rangeHintEl.textContent = `Will generate all ${docParts.length} part${docParts.length === 1 ? '' : 's'} (${mode}-based).`;
      } else if (sel.length === 0) {
        rangeHintEl.textContent = `No parts match the selected ${mode}s.`;
      } else {
        rangeHintEl.textContent = `Will generate ${sel.length} part${sel.length === 1 ? '' : 's'} (${mode}-based).`;
      }
    }
    rangeInputEl.addEventListener('input', updateRangeHint);

    $('genAllParts').addEventListener('click', async () => {
      if (genAllAbort) { genAllAbort.abort(); return; }
      if (!docParts.length) { setStatus('No parts to generate. Split first.'); return; }
      if (typeof JSZip === 'undefined') { setStatus('ZIP library failed to load.'); return; }
      if (hqGenerateEl.disabled || hqGenerateEl.textContent === HQ_LABEL_BUSY) {
        setStatus('Single MP3 generation in progress — stop that first.');
        return;
      }
      const voice = hqVoiceEl.value;
      if (!voice || voice === 'Server unavailable') { setStatus('Voice picker is empty — refresh the page and try again.'); return; }
      const selected = parseRange(rangeInputEl.value, docParts.length);
      console.log('[batch generate] range input:', JSON.stringify(rangeInputEl.value), '→ selected parts:', selected, '| pages mode:', partsHavePages());
      if (selected === null) { setStatus(`❌ Range "${rangeInputEl.value}" is invalid — fix and try again.`); return; }
      if (!selected.length) {
        const mode = partsHavePages() ? 'pages' : 'parts';
        setStatus(`❌ No parts match "${rangeInputEl.value}" (${mode}-based). Clear the range field to generate all.`);
        return;
      }

      const ratePct = Math.round((parseFloat(speedEl.value) - 1) * 100);
      genAllAbort = new AbortController();
      const btn = $('genAllParts');
      btn.textContent = GEN_ALL_BUSY;
      hqGenerateEl.disabled = true;

      const zip = new JSZip();
      const padding = String(docParts.length).length;
      const pagePadding = String(docTotalPages || 1).length;
      const hasPages = docParts.some(p => p.pages);
      function partFilename(partNum, part) {
        if (part.pages) {
          const f = String(part.pages.from).padStart(pagePadding, '0');
          const t = String(part.pages.to).padStart(pagePadding, '0');
          const suffix = part.subTotal ? `-${String.fromCharCode(97 + part.subIndex)}` : '';
          return part.pages.from === part.pages.to
            ? `pp-${f}${suffix}.mp3`
            : `pp-${f}-${t}${suffix}.mp3`;
        }
        return `${String(partNum).padStart(padding, '0')}-of-${docParts.length}.mp3`;
      }
      const manifestLines = [
        `Read Aloud — Part files`,
        `Generated: ${new Date().toISOString()}`,
        `Voice: ${voice}`,
        `Rate: ${(parseFloat(speedEl.value)).toFixed(1)}x`,
        `Range: ${rangeInputEl.value.trim() || 'all'}`,
        `Parts: ${selected[0]}-${selected[selected.length - 1]} of ${docParts.length} (${selected.length} selected)`,
        docTotalPages ? `Source pages: ${docTotalPages}${docParts.some(p => p.pages) ? ' (filenames use exact page ranges)' : ''}` : '',
        ``,
      ].filter(Boolean);
      let completed = 0;
      let lastDonePartNum = 0;
      let aborted = false;

      try {
        for (let pos = 0; pos < selected.length; pos++) {
          if (genAllAbort.signal.aborted) { aborted = true; break; }
          const partNum = selected[pos];
          const idx = partNum - 1;
          const p = docParts[idx];
          const padded = String(partNum).padStart(padding, '0');
          const totalNum = String(docParts.length);
          showProgress(`Part ${partNum} (${pos + 1}/${selected.length})…`, (pos / selected.length) * 100);
          const r = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: p.text, voice, rate: ratePct }),
            signal: genAllAbort.signal,
          });
          if (!r.ok) {
            const errText = await r.text().catch(() => '');
            let msg = errText;
            try { msg = JSON.parse(errText).error || errText; } catch {}
            throw new Error(`Part ${partNum}: ${msg || r.status}`);
          }
          const blob = await r.blob();
          const filename = partFilename(partNum, p);
          const pageTag = p.pages ? ` (${p.pages.from === p.pages.to ? 'p ' + p.pages.from : 'pp ' + p.pages.from + '-' + p.pages.to})` : '';
          zip.file(filename, blob);
          manifestLines.push(`${filename}  part ${partNum}${pageTag}  ${p.words.toLocaleString()} words  ${(blob.size / 1024).toFixed(0)} KB`);
          completed++;
          lastDonePartNum = partNum;
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          aborted = true;
        } else {
          console.error(err);
          setStatus(`Stopped at part ${lastDonePartNum + 1}: ${err.message || err}`);
        }
      }

      genAllAbort = null;
      btn.textContent = GEN_ALL_IDLE;
      hqGenerateEl.disabled = false;

      if (completed === 0) {
        hideProgress();
        setStatus(aborted ? 'Cancelled. Nothing to download.' : 'No parts generated.');
        return;
      }

      showProgressIndeterminate(`Building ZIP (${completed} part${completed === 1 ? '' : 's'})…`);
      zip.file('manifest.txt', manifestLines.join('\n'));
      const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      hideProgress();

      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const rangeTag = (selected.length === docParts.length)
        ? 'all'
        : `${selected[0]}-${selected[selected.length - 1]}`;
      a.download = `read-aloud-${rangeTag}-${stamp}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      if (aborted && lastDonePartNum < docParts.length) {
        const byPages = partsHavePages();
        let resumeFrom;
        if (byPages) {
          const lastDonePart = docParts[lastDonePartNum - 1];
          resumeFrom = (lastDonePart && lastDonePart.pages) ? lastDonePart.pages.to + 1 : lastDonePartNum + 1;
        } else {
          resumeFrom = lastDonePartNum + 1;
        }
        rangeInputEl.value = `${resumeFrom}-`;
        updateRangeHint();
        const what = byPages ? `page ${resumeFrom}` : `part ${resumeFrom}`;
        setStatus(`Partial ZIP: ${completed} part${completed === 1 ? '' : 's'}. Range pre-filled to resume from ${what}.`);
      } else {
        setStatus(`ZIP ready: ${completed} part${completed === 1 ? '' : 's'} (${(zipBlob.size / 1024 / 1024).toFixed(1)} MB) downloaded`);
      }
    });

    async function summarize(text) {
      const Sum = window.Summarizer || (window.ai && window.ai.summarizer);
      if (Sum) {
        try {
          const avail = await (Sum.availability ? Sum.availability() : Sum.capabilities && Sum.capabilities());
          const ok = avail === 'available' || avail === 'downloadable' || avail === 'downloading' || (avail && avail.available && avail.available !== 'no');
          if (ok) {
            showProgressIndeterminate('Initializing on-device AI…');
            const summarizer = await Sum.create({
              type: 'key-points',
              format: 'plain-text',
              length: 'medium',
              monitor(m) {
                m.addEventListener?.('downloadprogress', e => {
                  const pct = Math.round((e.loaded || 0) * 100);
                  showProgress(`Downloading AI model · ${pct}%`, pct);
                });
              }
            });
            const input = text.length > 16000 ? text.slice(0, 16000) : text;
            showProgressIndeterminate('Summarizing with on-device AI…');
            const summary = await summarizer.summarize(input);
            summarizer.destroy?.();
            return { summary, mode: 'AI · on-device' };
          }
        } catch (err) {
          console.warn('Summarizer API failed, falling back to extractive', err);
        }
      }
      showProgressIndeterminate('Generating extractive summary…');
      return { summary: extractiveSummary(text), mode: 'extractive' };
    }

    function extractiveSummary(text, ratio = 0.2) {
      const sentences = text
        .replace(/\s+/g, ' ')
        .split(/(?<=[.!?…])\s+/)
        .map(s => s.trim())
        .filter(s => s.length > 15);
      if (sentences.length <= 3) return sentences.join(' ');

      const stop = new Set(('a an the is are was were be been being have has had do does did will would could should can may might must of to in on at for with from by as it its this that these those i you he she we they me him her us them and or but if not so also do not don\'t doesn\'t isn\'t aren\'t there their they\'re what when where who why how which while because however thus therefore than then them very some any all most more less much many few each every other another such here').split(' '));

      const freq = new Map();
      for (const s of sentences) {
        const words = s.toLowerCase().match(/\b[a-z'][\w']*\b/g) || [];
        for (const w of words) {
          if (stop.has(w) || w.length < 3) continue;
          freq.set(w, (freq.get(w) || 0) + 1);
        }
      }
      if (!freq.size) return sentences.slice(0, 5).join(' ');
      const maxFreq = Math.max(...freq.values());
      for (const [k, v] of freq) freq.set(k, v / maxFreq);

      const scored = sentences.map((s, i) => {
        const words = s.toLowerCase().match(/\b[a-z'][\w']*\b/g) || [];
        let score = 0;
        for (const w of words) score += freq.get(w) || 0;
        score = score / Math.max(1, Math.sqrt(words.length));
        if (i < sentences.length * 0.25) score *= 1.15;
        return { score, idx: i };
      });

      const target = Math.max(3, Math.min(15, Math.round(sentences.length * ratio)));
      scored.sort((a, b) => b.score - a.score);
      const keep = new Set(scored.slice(0, target).map(s => s.idx));
      return sentences.filter((_, i) => keep.has(i)).join(' ');
    }

    async function readFile(f) {
      const name = f.name.toLowerCase();
      if (name.endsWith('.txt')) return { text: await f.text() };
      if (name.endsWith('.docx')) return { text: await readDocx(f) };
      if (name.endsWith('.pdf')) return await readPdf(f);
      if (f.type.startsWith('image/')) return { text: await readImage(f) };
      throw new Error(`Unsupported file: ${f.name}`);
    }

    async function readDocx(f) {
      const buf = await f.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      return result.value;
    }

    async function readPdf(f) {
      const buf = await f.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const pageLines = [];
      const total = doc.numPages;
      for (let i = 1; i <= total; i++) {
        showProgress(`Reading PDF page ${i}/${total}`, ((i - 1) / total) * 100);
        const page = await doc.getPage(i);
        const lines = await extractPageLines(page);
        const joined = lines.join(' ').trim();
        if (joined.length > 20) {
          pageLines.push(lines);
        } else {
          pageLines.push([await ocrPdfPage(page, i, total)]);
        }
      }
      showProgress('Deduplicating headers/footers…', 100);
      const deduped = dedupPageLines(pageLines);

      // Apply cleanup + reflow PER PAGE so page boundary offsets stay accurate
      const pageMap = [];
      let text = '';
      for (let i = 0; i < deduped.length; i++) {
        const rawPageText = deduped[i].join('\n').trim();
        if (!rawPageText) continue;
        const cleaned = reflowText(cleanupText(rawPageText)).trim();
        if (!cleaned) continue;
        if (text) text += '\n\n';
        const start = text.length;
        text += cleaned;
        pageMap.push({ page: i + 1, start, end: text.length });
      }
      return { text, pageCount: total, pageMap, isPreCleaned: true };
    }

    async function extractPageLines(page) {
      const tc = await page.getTextContent();
      const lineMap = new Map();
      for (const item of tc.items) {
        const y = Math.round(item.transform[5]);
        if (!lineMap.has(y)) lineMap.set(y, []);
        lineMap.get(y).push(item.str);
      }
      const ys = [...lineMap.keys()].sort((a, b) => b - a);
      return ys
        .map(y => lineMap.get(y).join(' ').replace(/\s+/g, ' ').trim())
        .filter(Boolean);
    }

    function dedupPageLines(pageLines) {
      if (pageLines.length < 3) return pageLines;
      const counts = new Map();
      for (const lines of pageLines) {
        const seen = new Set();
        for (const line of lines) {
          if (line.length > 120 || seen.has(line)) continue;
          seen.add(line);
          counts.set(line, (counts.get(line) || 0) + 1);
        }
      }
      const threshold = Math.ceil(pageLines.length * 0.5);
      const drop = new Set();
      for (const [line, n] of counts) {
        if (n >= threshold) drop.add(line);
      }
      return pageLines.map(lines => lines.filter(l => !drop.has(l)));
    }

    function reflowText(text) {
      if (!text) return text;
      text = text.replace(/([A-Za-z֐-׿])-\s*\n\s*([A-Za-z֐-׿])/g, '$1$2');
      text = text.replace(/(?<!\n)\n(?!\n)/g, ' ');
      text = text.replace(/[ \t]+/g, ' ');
      text = text.replace(/\n{2,}/g, '\n\n');
      return text.trim();
    }

    function cleanupText(text) {
      const ORG = '(?:Institute|Inc\\.?|Press|Publishing|Publications|Ltd\\.?|LLC|Foundation|Society|Association|University|Group|Co\\.?|Corporation|Company|Journal)';
      const patterns = [
        /\b\d{4}-\d{4}\/\d{2}\s+\$[\d.+]+/g,
        new RegExp(`\\bCopyright\\s*©\\s*\\d{4}\\s+[A-Z][\\w.\\s&,]{0,150}?${ORG}\\b\\.?`, 'gi'),
        new RegExp(`©\\s*\\d{4}\\s+[A-Z][\\w.\\s&,]{0,150}?${ORG}\\b\\.?`, 'g'),
        /\bAll rights (?:of reproduction in any form )?reserved\.?/gi,
        /\bFirst presented at[^.]+\./gi,
        /\bOriginally published in[^.]+\./gi,
        /\bReprinted (?:from|with permission)[^.]+\./gi,
        /\bDownloaded (?:from|by)[^.]+\./gi,
        /\b\d{1,5}\s+(?:[NSEW]\.?\s+)?(?:\d+(?:st|nd|rd|th)?|[A-Z]\w*)\s+(?:Street|St\.?|Avenue|Ave\.?|Road|Rd\.?|Blvd\.?|Boulevard)\s*,?\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*,?\s*[A-Z]{2}\s+\d{5}/g,
        /\b[A-Z][a-z][\w']*(?:\s+[A-Za-z][\w']*){0,8},\s*Vol\.\s*\d+,?\s*No\.\s*\d+\s*\(\d{4}\)(?:\s+\d{1,4}(?=\s|$))?/g,
        /\bISSN[\s:]+\d{4}-\d{4}/gi,
        /\bDOI[\s:]+10\.\d+\/\S+/gi,
        /\bhttps?:\/\/(?:doi\.org|dx\.doi\.org)\/\S+/gi,
        /^\s*Page\s+\d+\s+of\s+\d+\s*$/gim,
        /^\s*\d+\s*$/gm,
      ];
      let cleaned = text;
      for (const re of patterns) cleaned = cleaned.replace(re, '');
      cleaned = cleaned.replace(/[ \t]+/g, ' ');
      cleaned = cleaned.replace(/\n[ \t]+/g, '\n');
      cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
      return cleaned.trim();
    }

    const ocrLangEl = $('ocrLang');
    ocrLangEl.value = localStorage.getItem('ocrLang') || 'eng';
    ocrLangEl.addEventListener('change', () => localStorage.setItem('ocrLang', ocrLangEl.value));

    async function ocrPdfPage(page, i, total) {
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      const { data: { text } } = await Tesseract.recognize(canvas, ocrLangEl.value, {
        logger: m => {
          const pagePct = m.progress || 0;
          const overall = ((i - 1 + pagePct) / total) * 100;
          const phase = m.status ? m.status.replace(/^\w/, c => c.toUpperCase()) : 'Processing';
          showProgress(`OCR page ${i}/${total} · ${phase} ${Math.round(pagePct * 100)}%`, overall);
        }
      });
      return text;
    }

    async function readImage(f) {
      showProgress('Loading OCR engine…', 0);
      try {
        const { data: { text } } = await Tesseract.recognize(f, ocrLangEl.value, {
          logger: m => {
            const pct = Math.round((m.progress || 0) * 100);
            const phase = m.status ? m.status.replace(/^\w/, c => c.toUpperCase()) : 'Processing';
            showProgress(`OCR · ${phase} ${pct}%`, pct);
          }
        });
        return text;
      } finally {
        // hideProgress runs in the file handler's finally
      }
    }

    clearEl.addEventListener('click', () => {
      stop();
      textEl.value = '';
      updateTextStats();
      progressPanelEl.hidden = true;
      progressEl.innerHTML = '';
      const sp = document.getElementById('summaryPanel');

    function setStatus(msg) { statusEl.textContent = msg; }

    const textStatsEl = $('textStats');
    function wordCount(s) { return (s.match(/\S+/g) || []).length; }
    function updateTextStats() {
      const t = textEl.value;
      textStatsEl.textContent = t
        ? `${wordCount(t).toLocaleString()} words · ${t.length.toLocaleString()} chars`
        : '';

    textEl.addEventListener('input', updateTextStats);
    updateTextStats();

    const pbarWrap = $('pbarWrap');
    const pbarFill = $('pbarFill');
    const pbarLabel = $('pbarLabel');
    function showProgress(label, pct) {
      pbarWrap.hidden = false;
      pbarFill.classList.remove('indeterminate');
      pbarFill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
      pbarLabel.textContent = label || '';
    }
    function showProgressIndeterminate(label) {
      pbarWrap.hidden = false;
      pbarFill.classList.add('indeterminate');
      pbarLabel.textContent = label || '';
    }
    function hideProgress() {
      pbarWrap.hidden = true;

      pbarFill.style.width = '0%';
      pbarLabel.textContent = '';
    }

    let chunks = [];
    let currentIdx = 0;
    let isPlaying = false;
    let isPaused = false;

    function chunkText(text) {
      const sentences = text
        .replace(/\s+/g, ' ')
        .split(/(?<=[.!?…])\s+/g)
        .map(s => s.trim())
        .filter(Boolean);
      const out = [];
      for (const s of sentences) {
        if (s.length <= 250) {
          out.push(s);
        } else {
          const parts = s.split(/(?<=[,;:])\s+/);
          let buf = '';
          for (const p of parts) {
            if ((buf + ' ' + p).trim().length > 250) {
              if (buf) out.push(buf.trim());
              buf = p;
            } else {
              buf = (buf + ' ' + p).trim();
            }
          }
          if (buf) out.push(buf.trim());
        }
      }
      return out;
    }

    function play(sourceText) {
      const explicit = typeof sourceText === 'string';
      if (!explicit && isPaused) {
        speechSynthesis.resume();
        isPaused = false;
        return;
      }
      const text = (explicit ? sourceText : textEl.value).trim();
      if (!text) {
        setStatus('Nothing to read.');
        return;
      }
      stop();
      chunks = chunkText(text);
      if (!chunks.length) return;
      currentIdx = 0;
      isPlaying = true;
      progressPanelEl.hidden = false;
      renderProgress();
      speakNext();
    }

    function speakNext() {
      if (!isPlaying) return;
      if (currentIdx >= chunks.length) {
        isPlaying = false;
        setStatus('Done.');
        return;
      }
      const u = new SpeechSynthesisUtterance(chunks[currentIdx]);
      const v = voices.find(x => x.voiceURI === voiceEl.value);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(speedEl.value);
      u.onend = () => {
        if (!isPlaying) return;
        currentIdx++;
        renderProgress();
        speakNext();
      };
      u.onerror = (e) => {
        console.error('TTS error', e);
        if (!isPlaying) return;
        currentIdx++;
        speakNext();
      };
      speechSynthesis.speak(u);
    }

    function pause() {
      if (isPlaying && !isPaused) {
        speechSynthesis.pause();
        isPaused = true;
      }
    }

    function stop() {
      isPlaying = false;
      isPaused = false;
      speechSynthesis.cancel();
      currentIdx = 0;
    }

    playEl.addEventListener('click', play);
    pauseEl.addEventListener('click', pause);
    stopEl.addEventListener('click', stop);

    speedEl.addEventListener('change', () => {
      if (isPlaying && !isPaused) {
        speechSynthesis.cancel();
        setTimeout(speakNext, 50);
      }
    });

    voiceEl.addEventListener('change', () => {
      if (isPlaying && !isPaused) {
        speechSynthesis.cancel();
        setTimeout(speakNext, 50);
      }
    });

    function renderProgress() {
      if (chunks.length > 500) {
        progressEl.textContent = `Sentence ${currentIdx + 1} of ${chunks.length}`;
        return;
      }
      progressEl.innerHTML = chunks.map((c, i) =>
        i === currentIdx ? `<span class="current">${escapeHtml(c)}</span>` : escapeHtml(c)
      ).join(' ');
      const cur = progressEl.querySelector('.current');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('beforeunload', () => speechSynthesis.cancel());

    const hqVoiceEl = $('hqVoice');
    const hqGenerateEl = $('hqGenerate');
    const hqDownloadEl = $('hqDownload');
    const hqAudioEl = $('hqAudio');
    let hqLastUrl = null;

    (async function loadHqVoices() {
      try {
        const r = await fetch('/api/voices');
        if (!r.ok) throw new Error('voices endpoint failed');
        const list = await r.json();
        const saved = localStorage.getItem('hqVoice') || 'en-US-AndrewNeural';
        hqVoiceEl.innerHTML = '';
        for (const v of list) {
          const opt = document.createElement('option');
          opt.value = v.id;
          opt.textContent = `${v.name}`;
          hqVoiceEl.appendChild(opt);
        }
        if (list.find(v => v.id === saved)) hqVoiceEl.value = saved;
      } catch (err) {
        hqVoiceEl.innerHTML = '<option>Server unavailable</option>';
        hqGenerateEl.disabled = true;
        console.warn('HQ voices unavailable:', err);
      }
    })();

    hqVoiceEl.addEventListener('change', () => {
      localStorage.setItem('hqVoice', hqVoiceEl.value);
    });

    let hqAbort = null;
    const HQ_LABEL_IDLE = 'Generate MP3 ✨';
    const HQ_LABEL_BUSY = '⏹ Stop & save';

    hqGenerateEl.addEventListener('click', async () => {
      if (hqAbort) {
        hqAbort.abort();
        return;
      }
      const text = textEl.value.trim();
      if (!text) { setStatus('Nothing to generate.'); return; }
      if (docParts.length > 1 && rangeInputEl && rangeInputEl.value.trim()) {
        setStatus('ℹ️ This button generates from the text area. To use the page range, scroll up to "Generate ⚡ (ZIP)".');
      }
      const ratePct = Math.round((parseFloat(speedEl.value) - 1) * 100);
      const estimated = Math.max(8000, text.length * 500);

      hqAbort = new AbortController();
      hqGenerateEl.textContent = HQ_LABEL_BUSY;
      const chunks = [];
      let received = 0;
      let aborted = false;

      showProgress('Connecting…', 0);
      try {
        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: hqVoiceEl.value, rate: ratePct }),
          signal: hqAbort.signal,
        });
        if (!r.ok) {
          const errText = await r.text();
          let msg = errText;
          try { msg = JSON.parse(errText).error || errText; } catch {}
          throw new Error(msg);
        }
        const totalChunks = Math.max(1, parseInt(r.headers.get('x-tts-chunks') || '1', 10));
        const reader = r.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          const pct = Math.min(99, Math.round((received / estimated) * 100));
          const cIdx = totalChunks > 1
            ? Math.min(totalChunks, 1 + Math.floor((received / estimated) * totalChunks))
            : null;
          const chunkLabel = cIdx ? ` · part ${cIdx}/${totalChunks}` : '';
          showProgress(`Generating MP3 · ${pct}%${chunkLabel} · ${(received / 1024).toFixed(0)} KB`, pct);
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          aborted = true;
        } else {
          console.error(err);
          setStatus(`MP3 generation failed: ${err.message || err}`);
          hqGenerateEl.textContent = HQ_LABEL_IDLE;
          hqAbort = null;
          hideProgress();
          return;
        }
      }

      hqAbort = null;
      hqGenerateEl.textContent = HQ_LABEL_IDLE;
      hideProgress();

      if (chunks.length === 0) {
        setStatus('Cancelled. No audio.');
        return;
      }
      const blob = new Blob(chunks, { type: 'audio/mpeg' });
      if (hqLastUrl) URL.revokeObjectURL(hqLastUrl);
      hqLastUrl = URL.createObjectURL(blob);
      hqAudioEl.src = hqLastUrl;
      hqAudioEl.hidden = false;
      hqDownloadEl.href = hqLastUrl;
      hqDownloadEl.hidden = false;
      const sizeKb = (blob.size / 1024).toFixed(0);
      setStatus(aborted
        ? `Stopped. Partial MP3 ready (${sizeKb} KB)`
        : `MP3 ready (${sizeKb} KB)`);
      hqAudioEl.play().catch(() => {});
    });
  </script>
</body>
</html>
