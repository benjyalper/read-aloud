<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1115">
  <title>Read Aloud</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --border: #2a2e38;
      --text: #e8e8ec;
      --muted: #9098a8;
      --accent: #4f8cff;
      --accent-hover: #3d75e0;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --panel: #ffffff;
        --border: #d1d1d6;
        --text: #1a1a1c;
        --muted: #6b6b75;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; display: flex; justify-content: center; }
    main {
      width: 100%;
      max-width: 720px;
      padding: 16px;
      padding-bottom: 60px;
    }
    h1 {
      font-size: 24px;
      margin: 8px 0 16px;
      letter-spacing: -0.5px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      min-height: 200px;
      max-height: 50vh;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row + .row { margin-top: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      font-family: inherit;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: var(--border); }
    label.btn { cursor: pointer; }
    label.btn input { display: none; }
    select, input[type="range"] {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 15px;
      font-family: inherit;
      min-height: 40px;
    }
    select { flex: 1; min-width: 200px; }
    .speed { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
    .speed input[type="range"] { flex: 1; padding: 0; min-height: 30px; }
    .player { display: flex; gap: 8px; flex-wrap: wrap; }
    .player .btn { flex: 1; min-width: 90px; }
    .status { font-size: 13px; color: var(--muted); flex: 1; min-width: 100%; }
    .progress {
      font-size: 14px;
      color: var(--muted);
      max-height: 240px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      line-height: 1.7;
    }
    .progress .current {
      background: var(--accent);
      color: white;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .small { font-size: 13px; color: var(--muted); }
    .pbar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .pbar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.15s ease-out;
      border-radius: 3px;
    }
    .pbar-fill.indeterminate {
      width: 35% !important;
      animation: pbar-slide 1.4s infinite ease-in-out;
      transition: none;
    }
    @keyframes pbar-slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
    .pbar-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }
    @media (max-width: 500px) {
      main { padding: 10px; }
      h1 { font-size: 20px; }
      .player .btn { font-size: 14px; padding: 10px 8px; min-width: 70px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Read Aloud</h1>

    <section class="panel">
      <textarea id="text" placeholder="Paste text here, or load a file below."></textarea>
      <div class="row" style="margin-top: 10px;">
        <label class="btn secondary">
          <input type="file" id="file" accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,.webp" hidden>
          Load file
        </label>
        <button class="btn secondary" id="cleanup" type="button" title="Remove copyright/header/footer boilerplate">Clean up ✨</button>
        <button class="btn secondary" id="summarize" type="button" title="Generate a summary">Summarize ✨</button>
        <button class="btn secondary" id="clear" type="button">Clear</button>
        <span id="status" class="status"></span>
      </div>
      <div class="small" style="margin-top: 6px;">PDF, DOCX, TXT, or image (OCR).</div>
      <div id="pbarWrap" hidden style="margin-top: 10px;">
        <div class="pbar"><div class="pbar-fill" id="pbarFill"></div></div>
        <div class="pbar-label" id="pbarLabel"></div>
      </div>
    </section>

    <section class="panel" id="summaryPanel" hidden>
      <div class="row" style="margin-bottom: 8px;">
        <span class="small" style="flex:1;">Summary <span id="summaryMode" class="small" style="opacity:0.7;"></span></span>
        <button class="btn secondary" id="playSummary" type="button" style="min-height:34px; padding: 6px 12px; font-size:13px;">▶ Read summary</button>
      </div>
      <textarea id="summary" placeholder="Generated summary will appear here." style="min-height: 140px;"></textarea>
    </section>

    <section class="panel">
      <div class="row">
        <select id="voice" aria-label="Voice"></select>
      </div>
      <div class="row">
        <div class="speed">
          <span class="small">Speed</span>
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" aria-label="Speed">
          <span id="speedValue" class="small">1.0×</span>
        </div>
      </div>
      <div class="row player">
        <button class="btn" id="play" type="button">▶ Play</button>
        <button class="btn secondary" id="pause" type="button">⏸ Pause</button>
        <button class="btn secondary" id="stop" type="button">⏹ Stop</button>
      </div>
    </section>

    <section class="panel" id="progressPanel" hidden>
      <div class="small" style="margin-bottom: 6px;">Progress</div>
      <div class="progress" id="progress"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }

    const $ = id => document.getElementById(id);
    const textEl = $('text');
    const fileEl = $('file');
    const clearEl = $('clear');
    const statusEl = $('status');
    const voiceEl = $('voice');
    const speedEl = $('speed');
    const speedValueEl = $('speedValue');
    const playEl = $('play');
    const pauseEl = $('pause');
    const stopEl = $('stop');
    const progressPanelEl = $('progressPanel');
    const progressEl = $('progress');

    let voices = [];

    function isNeural(v) {
      const n = v.name.toLowerCase();
      return n.includes('online') || n.includes('natural') || n.includes('neural') || n.includes('siri') || n.includes('enhanced');
    }
    function score(v) {
      let s = 0;
      if (isNeural(v)) s += 100;
      if (v.lang.startsWith('en')) s += 10;
      return s;
    }
    function loadVoices() {
      voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      const eng = voices.filter(v => v.lang.startsWith('en'));
      const other = voices.filter(v => !v.lang.startsWith('en'));
      const ranked = [...eng, ...other].sort((a, b) => score(b) - score(a));

      const prev = voiceEl.value;
      voiceEl.innerHTML = '';
      for (const v of ranked) {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} — ${v.lang}${isNeural(v) ? ' ✨' : ''}`;
        voiceEl.appendChild(opt);
      }
      if (prev && ranked.find(v => v.voiceURI === prev)) {
        voiceEl.value = prev;
      } else {
        const best = ranked.find(v => v.lang.startsWith('en')) || ranked[0];
        if (best) voiceEl.value = best.voiceURI;
      }
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    speedEl.addEventListener('input', () => {
      speedValueEl.textContent = parseFloat(speedEl.value).toFixed(1) + '×';
    });

    fileEl.addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        setStatus(`Reading ${f.name}…`);
        const raw = await readFile(f);
        const isAuto = !f.name.toLowerCase().endsWith('.txt');
        const final = isAuto ? cleanupText(raw) : raw;
        textEl.value = final.trim();
        const removed = raw.length - final.length;
        const note = isAuto && removed > 0 ? ` · cleaned ${removed.toLocaleString()} chars` : '';
        setStatus(`Loaded ${f.name} (${final.length.toLocaleString()} chars${note})`);
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message || err}`);
      } finally {
        fileEl.value = '';
        hideProgress();
      }
    });

    $('cleanup').addEventListener('click', () => {
      const before = textEl.value;
      const after = cleanupText(before);
      textEl.value = after;
      const removed = before.length - after.length;
      setStatus(removed > 0
        ? `Cleaned ${removed.toLocaleString()} chars (${before.length.toLocaleString()} → ${after.length.toLocaleString()})`
        : 'Nothing to clean.');
    });

    const summaryEl = $('summary');
    const summaryPanelEl = $('summaryPanel');
    const summaryModeEl = $('summaryMode');

    $('summarize').addEventListener('click', async () => {
      const text = textEl.value.trim();
      if (!text) { setStatus('Nothing to summarize.'); return; }
      try {
        const { summary, mode } = await summarize(text);
        summaryEl.value = summary;
        summaryModeEl.textContent = `· ${mode}`;
        summaryPanelEl.hidden = false;
        setStatus(`Summary ready (${summary.length.toLocaleString()} chars)`);
      } catch (err) {
        console.error(err);
        setStatus(`Summarize failed: ${err.message || err}`);
      } finally {
        hideProgress();
      }
    });

    $('playSummary').addEventListener('click', () => play(summaryEl.value));

    async function summarize(text) {
      const Sum = window.Summarizer || (window.ai && window.ai.summarizer);
      if (Sum) {
        try {
          const avail = await (Sum.availability ? Sum.availability() : Sum.capabilities && Sum.capabilities());
          const ok = avail === 'available' || avail === 'downloadable' || avail === 'downloading' || (avail && avail.available && avail.available !== 'no');
          if (ok) {
            showProgressIndeterminate('Initializing on-device AI…');
            const summarizer = await Sum.create({
              type: 'key-points',
              format: 'plain-text',
              length: 'medium',
              monitor(m) {
                m.addEventListener?.('downloadprogress', e => {
                  const pct = Math.round((e.loaded || 0) * 100);
                  showProgress(`Downloading AI model · ${pct}%`, pct);
                });
              }
            });
            const input = text.length > 16000 ? text.slice(0, 16000) : text;
            showProgressIndeterminate('Summarizing with on-device AI…');
            const summary = await summarizer.summarize(input);
            summarizer.destroy?.();
            return { summary, mode: 'AI · on-device' };
          }
        } catch (err) {
          console.warn('Summarizer API failed, falling back to extractive', err);
        }
      }
      showProgressIndeterminate('Generating extractive summary…');
      return { summary: extractiveSummary(text), mode: 'extractive' };
    }

    function extractiveSummary(text, ratio = 0.2) {
      const sentences = text
        .replace(/\s+/g, ' ')
        .split(/(?<=[.!?…])\s+/)
        .map(s => s.trim())
        .filter(s => s.length > 15);
      if (sentences.length <= 3) return sentences.join(' ');

      const stop = new Set(('a an the is are was were be been being have has had do does did will would could should can may might must of to in on at for with from by as it its this that these those i you he she we they me him her us them and or but if not so also do not don\'t doesn\'t isn\'t aren\'t there their they\'re what when where who why how which while because however thus therefore than then them very some any all most more less much many few each every other another such here').split(' '));

      const freq = new Map();
      for (const s of sentences) {
        const words = s.toLowerCase().match(/\b[a-z'][\w']*\b/g) || [];
        for (const w of words) {
          if (stop.has(w) || w.length < 3) continue;
          freq.set(w, (freq.get(w) || 0) + 1);
        }
      }
      if (!freq.size) return sentences.slice(0, 5).join(' ');
      const maxFreq = Math.max(...freq.values());
      for (const [k, v] of freq) freq.set(k, v / maxFreq);

      const scored = sentences.map((s, i) => {
        const words = s.toLowerCase().match(/\b[a-z'][\w']*\b/g) || [];
        let score = 0;
        for (const w of words) score += freq.get(w) || 0;
        score = score / Math.max(1, Math.sqrt(words.length));
        if (i < sentences.length * 0.25) score *= 1.15;
        return { score, idx: i };
      });

      const target = Math.max(3, Math.min(15, Math.round(sentences.length * ratio)));
      scored.sort((a, b) => b.score - a.score);
      const keep = new Set(scored.slice(0, target).map(s => s.idx));
      return sentences.filter((_, i) => keep.has(i)).join(' ');
    }

    async function readFile(f) {
      const name = f.name.toLowerCase();
      if (name.endsWith('.txt')) return await f.text();
      if (name.endsWith('.docx')) return await readDocx(f);
      if (name.endsWith('.pdf')) return await readPdf(f);
      if (f.type.startsWith('image/')) return await readImage(f);
      throw new Error(`Unsupported file: ${f.name}`);
    }

    async function readDocx(f) {
      const buf = await f.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      return result.value;
    }

    async function readPdf(f) {
      const buf = await f.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const pageLines = [];
      const total = doc.numPages;
      for (let i = 1; i <= total; i++) {
        showProgress(`Reading PDF page ${i}/${total}`, ((i - 1) / total) * 100);
        const page = await doc.getPage(i);
        const lines = await extractPageLines(page);
        const joined = lines.join(' ').trim();
        if (joined.length > 20) {
          pageLines.push(lines);
        } else {
          pageLines.push([await ocrPdfPage(page, i, total)]);
        }
      }
      showProgress('Deduplicating headers/footers…', 100);
      const deduped = dedupPageLines(pageLines);
      return deduped.map(lines => lines.join('\n')).join('\n\n');
    }

    async function extractPageLines(page) {
      const tc = await page.getTextContent();
      const lineMap = new Map();
      for (const item of tc.items) {
        const y = Math.round(item.transform[5]);
        if (!lineMap.has(y)) lineMap.set(y, []);
        lineMap.get(y).push(item.str);
      }
      const ys = [...lineMap.keys()].sort((a, b) => b - a);
      return ys
        .map(y => lineMap.get(y).join(' ').replace(/\s+/g, ' ').trim())
        .filter(Boolean);
    }

    function dedupPageLines(pageLines) {
      if (pageLines.length < 3) return pageLines;
      const counts = new Map();
      for (const lines of pageLines) {
        const seen = new Set();
        for (const line of lines) {
          if (line.length > 120 || seen.has(line)) continue;
          seen.add(line);
          counts.set(line, (counts.get(line) || 0) + 1);
        }
      }
      const threshold = Math.ceil(pageLines.length * 0.5);
      const drop = new Set();
      for (const [line, n] of counts) {
        if (n >= threshold) drop.add(line);
      }
      return pageLines.map(lines => lines.filter(l => !drop.has(l)));
    }

    function cleanupText(text) {
      const ORG = '(?:Institute|Inc\\.?|Press|Publishing|Publications|Ltd\\.?|LLC|Foundation|Society|Association|University|Group|Co\\.?|Corporation|Company|Journal)';
      const patterns = [
        /\b\d{4}-\d{4}\/\d{2}\s+\$[\d.+]+/g,
        new RegExp(`\\bCopyright\\s*©\\s*\\d{4}\\s+[A-Z][\\w.\\s&,]{0,150}?${ORG}\\b\\.?`, 'gi'),
        new RegExp(`©\\s*\\d{4}\\s+[A-Z][\\w.\\s&,]{0,150}?${ORG}\\b\\.?`, 'g'),
        /\bAll rights (?:of reproduction in any form )?reserved\.?/gi,
        /\bFirst presented at[^.]+\./gi,
        /\bOriginally published in[^.]+\./gi,
        /\bReprinted (?:from|with permission)[^.]+\./gi,
        /\bDownloaded (?:from|by)[^.]+\./gi,
        /\b\d{1,5}\s+(?:[NSEW]\.?\s+)?(?:\d+(?:st|nd|rd|th)?|[A-Z]\w*)\s+(?:Street|St\.?|Avenue|Ave\.?|Road|Rd\.?|Blvd\.?|Boulevard)\s*,?\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*,?\s*[A-Z]{2}\s+\d{5}/g,
        /\b[A-Z][a-z][\w']*(?:\s+[A-Za-z][\w']*){0,8},\s*Vol\.\s*\d+,?\s*No\.\s*\d+\s*\(\d{4}\)(?:\s+\d{1,4}(?=\s|$))?/g,
        /\bISSN[\s:]+\d{4}-\d{4}/gi,
        /\bDOI[\s:]+10\.\d+\/\S+/gi,
        /\bhttps?:\/\/(?:doi\.org|dx\.doi\.org)\/\S+/gi,
        /^\s*Page\s+\d+\s+of\s+\d+\s*$/gim,
        /^\s*\d+\s*$/gm,
      ];
      let cleaned = text;
      for (const re of patterns) cleaned = cleaned.replace(re, '');
      cleaned = cleaned.replace(/[ \t]+/g, ' ');
      cleaned = cleaned.replace(/\n[ \t]+/g, '\n');
      cleaned = cleaned.replace(/\n{3,}/g, '\n\n');
      return cleaned.trim();
    }

    async function ocrPdfPage(page, i, total) {
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      const { data: { text } } = await Tesseract.recognize(canvas, 'eng', {
        logger: m => {
          const pagePct = m.progress || 0;
          const overall = ((i - 1 + pagePct) / total) * 100;
          const phase = m.status ? m.status.replace(/^\w/, c => c.toUpperCase()) : 'Processing';
          showProgress(`OCR page ${i}/${total} · ${phase} ${Math.round(pagePct * 100)}%`, overall);
        }
      });
      return text;
    }

    async function readImage(f) {
      showProgress('Loading OCR engine…', 0);
      try {
        const { data: { text } } = await Tesseract.recognize(f, 'eng', {
          logger: m => {
            const pct = Math.round((m.progress || 0) * 100);
            const phase = m.status ? m.status.replace(/^\w/, c => c.toUpperCase()) : 'Processing';
            showProgress(`OCR · ${phase} ${pct}%`, pct);
          }
        });
        return text;
      } finally {
        // hideProgress runs in the file handler's finally
      }
    }

    clearEl.addEventListener('click', () => {
      stop();
      textEl.value = '';
      progressPanelEl.hidden = true;
      progressEl.innerHTML = '';
      const sp = document.getElementById('summaryPanel');
      const su = document.getElementById('summary');
      if (sp) sp.hidden = true;
      if (su) su.value = '';
      setStatus('');
    });

    function setStatus(msg) { statusEl.textContent = msg; }

    const pbarWrap = $('pbarWrap');
    const pbarFill = $('pbarFill');
    const pbarLabel = $('pbarLabel');
    function showProgress(label, pct) {
      pbarWrap.hidden = false;
      pbarFill.classList.remove('indeterminate');
      pbarFill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
      pbarLabel.textContent = label || '';
    }
    function showProgressIndeterminate(label) {
      pbarWrap.hidden = false;
      pbarFill.classList.add('indeterminate');
      pbarLabel.textContent = label || '';
    }
    function hideProgress() {
      pbarWrap.hidden = true;
      pbarFill.classList.remove('indeterminate');
      pbarFill.style.width = '0%';
      pbarLabel.textContent = '';
    }

    let chunks = [];
    let currentIdx = 0;
    let isPlaying = false;
    let isPaused = false;

    function chunkText(text) {
      const sentences = text
        .replace(/\s+/g, ' ')
        .split(/(?<=[.!?…])\s+/g)
        .map(s => s.trim())
        .filter(Boolean);
      const out = [];
      for (const s of sentences) {
        if (s.length <= 250) {
          out.push(s);
        } else {
          const parts = s.split(/(?<=[,;:])\s+/);
          let buf = '';
          for (const p of parts) {
            if ((buf + ' ' + p).trim().length > 250) {
              if (buf) out.push(buf.trim());
              buf = p;
            } else {
              buf = (buf + ' ' + p).trim();
            }
          }
          if (buf) out.push(buf.trim());
        }
      }
      return out;
    }

    function play(sourceText) {
      const explicit = typeof sourceText === 'string';
      if (!explicit && isPaused) {
        speechSynthesis.resume();
        isPaused = false;
        return;
      }
      const text = (explicit ? sourceText : textEl.value).trim();
      if (!text) {
        setStatus('Nothing to read.');
        return;
      }
      stop();
      chunks = chunkText(text);
      if (!chunks.length) return;
      currentIdx = 0;
      isPlaying = true;
      progressPanelEl.hidden = false;
      renderProgress();
      speakNext();
    }

    function speakNext() {
      if (!isPlaying) return;
      if (currentIdx >= chunks.length) {
        isPlaying = false;
        setStatus('Done.');
        return;
      }
      const u = new SpeechSynthesisUtterance(chunks[currentIdx]);
      const v = voices.find(x => x.voiceURI === voiceEl.value);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(speedEl.value);
      u.onend = () => {
        if (!isPlaying) return;
        currentIdx++;
        renderProgress();
        speakNext();
      };
      u.onerror = (e) => {
        console.error('TTS error', e);
        if (!isPlaying) return;
        currentIdx++;
        speakNext();
      };
      speechSynthesis.speak(u);
    }

    function pause() {
      if (isPlaying && !isPaused) {
        speechSynthesis.pause();
        isPaused = true;
      }
    }

    function stop() {
      isPlaying = false;
      isPaused = false;
      speechSynthesis.cancel();
      currentIdx = 0;
    }

    playEl.addEventListener('click', play);
    pauseEl.addEventListener('click', pause);
    stopEl.addEventListener('click', stop);

    speedEl.addEventListener('change', () => {
      if (isPlaying && !isPaused) {
        speechSynthesis.cancel();
        setTimeout(speakNext, 50);
      }
    });

    voiceEl.addEventListener('change', () => {
      if (isPlaying && !isPaused) {
        speechSynthesis.cancel();
        setTimeout(speakNext, 50);
      }
    });

    function renderProgress() {
      if (chunks.length > 500) {
        progressEl.textContent = `Sentence ${currentIdx + 1} of ${chunks.length}`;
        return;
      }
      progressEl.innerHTML = chunks.map((c, i) =>
        i === currentIdx ? `<span class="current">${escapeHtml(c)}</span>` : escapeHtml(c)
      ).join(' ');
      const cur = progressEl.querySelector('.current');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('beforeunload', () => speechSynthesis.cancel());
  </script>
</body>
</html>
